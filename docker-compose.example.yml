# AiTaskApi Docker Compose Configuration
# Copy .env.example to .env and change values as needed.

services:
  db:
    image: postgres:16
    container_name: aitaskapi_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-aitaskapi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aitaskapi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: AiTaskApi/Dockerfile
    container_name: aitaskapi_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${DB_NAME:-aitaskapi};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      LLM_SERVER: ${LLM_SERVER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5058:8080"

  worker:
    build:
      context: ./backend
      dockerfile: AiTaskApi.Worker/Dockerfile
    container_name: aitaskapi_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${DB_NAME:-aitaskapi};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      LLM_SERVER: ${LLM_SERVER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: aitaskapi_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
